<svg xmlns="http://www.w3.org/2000/svg" width="600" height="90" viewBox="0 0 600 90" role="img" aria-labelledby="title desc">
  <title id="title">02 · ls ./projects/</title>
  <desc id="desc">待执行的项目命令；光标闪烁等待点击或回车，不自动输入。</desc>
  <style>
    @keyframes wait-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: wait-cursor 1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="command-clip">
      <rect class="typing-window" x="72" y="20" width="184" height="30"/>
    </clipPath>
  </defs>
  <text x="0" y="42" font-family="Consolas,monospace" font-size="15" fill="#768390">02</text>
  <text x="40" y="42" font-family="Consolas,monospace" font-size="24" fill="#7dbbb4">$</text>
  <text x="72" y="42" font-family="Consolas,monospace" font-size="23" fill="#c9d1d9" textLength="184" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-clip)">ls ./projects/</text>
  <g class="cursor-position" transform="translate(184 0)">
    <rect class="cursor" x="72" y="25" width="9" height="23" fill="#e7b47f"/>
  </g>
  <line x1="0" y1="73" x2="600" y2="73" stroke="#30363d"/>
</svg>
