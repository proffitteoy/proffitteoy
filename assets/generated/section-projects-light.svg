  <text x="92" y="42" font-family="Consolas,monospace" font-size="21" fill="#24292f" textLength="168" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-clip)">ls ./projects/</text>
  <g class="cursor-position" transform="translate(168 0)">
