<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-labelledby="title desc">
  <title id="title">01 · cat ./about.md</title>
  <desc id="desc">逐字输入简介命令后，光标结束等待，命令作为终端历史保留；下一条由读者手动触发。</desc>
  <style>
    @keyframes type-command {
      from { width: 0; }
      to { width: 168px; }
    }
    @keyframes move-cursor {
      from { transform: translateX(0); }
      to { transform: translateX(168px); }
    }
    @keyframes wait-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes finish-command {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .typing-window { animation: type-command 2.1s steps(14, end) .6s both; }
    .cursor-position { opacity: 0; animation: move-cursor 2.1s steps(14, end) .6s both, finish-command 3.6s step-end both; }
    .cursor { animation: wait-cursor 1s step-end 2.7s infinite; }
    @media (prefers-reduced-motion: reduce) {
      .typing-window, .cursor-position, .cursor { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="command-clip">
      <rect class="typing-window" x="92" y="20" width="168" height="30"/>
    </clipPath>
  </defs>
  <text x="0" y="42" font-family="Consolas,monospace" font-size="18" fill="#768390">01</text>
  <text x="60" y="42" font-family="Consolas,monospace" font-size="22" fill="#7dbbb4">❯</text>
  <text x="92" y="42" font-family="Consolas,monospace" font-size="21" fill="#c9d1d9" textLength="168" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-clip)">cat ./about.md</text>
  <g class="cursor-position" transform="translate(168 0)">
    <rect class="cursor" x="92" y="25" width="8" height="20" fill="#e7b47f"/>
  </g>
  <line x1="0" y1="73" x2="1200" y2="73" stroke="#30363d"/>
</svg>
