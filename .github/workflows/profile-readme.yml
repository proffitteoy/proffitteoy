name: Update profile README

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Profile cache operation
        required: true
        default: daily
        type: choice
        options:
          - daily
          - initialize
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Initialize profile cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'initialize' }}
        env:
          ACCESS_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USER_NAME: ${{ github.repository_owner }}
        run: python initialize_profile.py

      - name: Incrementally refresh profile data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'daily' }}
        env:
          ACCESS_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py

      - name: Commit updated SVG and cache
        run: |
          if git diff --quiet -- light_mode.svg dark_mode.svg cache; then
            echo "Profile data is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_mode.svg dark_mode.svg cache
          git commit -m "Update profile metrics"
          git push
